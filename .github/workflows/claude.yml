# Lets "@claude" in issues, issue comments and pull request reviews start Claude Code.
# Based on the official example in anthropics/claude-code-action (examples/claude.yml).
#
# Only people with write access to this repository can trigger it (the action's default), so
# comments from other GitHub users on this public repository are ignored.
#
# Setup: install the Claude GitHub app (https://github.com/apps/claude) on this repository and add
# the repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`). To use an API key
# instead, add ANTHROPIC_API_KEY and swap the commented credential lines below.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on pull requests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Node and dependencies so Claude can run the unit tests, typecheck, lint and build.
      # PostgreSQL/S3 integration checks (check:p2/p3/p5) are not available here.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(npm test),Bash(npm run typecheck),Bash(npm run lint),Bash(npm run format),Bash(npm run format:check),Bash(npm run build)"
