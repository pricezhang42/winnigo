# Checks every pull request and every push to main: formatting, lint, types, unit tests, the
# database checks against throwaway PostgreSQL and S3-compatible storage (compose.yaml), and the
# production build. Needs no secrets: `npm run setup` generates local-only values.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Start PostgreSQL, storage and FlareSolverr
        run: npm run setup && npm run services:up && npm run db:migrate
      - run: npm run check:events
      - run: npm run check:p2
      - run: npm run check:p3
      - run: npm run check:p5
      - run: npm run build
