# Production on one server (docs/32-deployment.md): PostgreSQL, the website, the collection
# worker and Caddy for HTTPS. Photos and database backups go to S3-compatible storage
# (Cloudflare R2). Every setting comes from .env.production, which is never committed.
# Run through deploy/compose.sh, which passes that file to Docker Compose.
#
# Staging is the same file in a second checkout with .env.staging: deploy/compose.sh then sets
# WINNIGO_STAGE=staging, which names the project, image and env file, and leaves Caddy out (the
# production Caddy serves both hosts over the shared winnigo-edge network).
name: winnigo

x-app: &app
  build: .
  image: winnigo-node:${WINNIGO_STAGE:-production}
  env_file: .env.${WINNIGO_STAGE:-production}
  environment: &app-environment
    DATABASE_URL: postgres://winnigo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/winnigo
    WINNIGO_AUTH_MODE: session
    WINNIGO_HOST: 0.0.0.0
    WINNIGO_DATA_DIR: /data
    # Caddy replaces this header with the visitor's address (lib/server/config.mjs).
    WINNIGO_CLIENT_IP_HEADER: x-forwarded-for
  depends_on:
    postgres:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options: { max-size: 10m, max-file: '5' }

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: winnigo
      POSTGRES_DB: winnigo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U winnigo -d winnigo']
      interval: 5s
      retries: 30
    restart: unless-stopped
    logging: *logging

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    environment:
      LOG_LEVEL: info
      LOG_HTML: 'false'
      TZ: America/Winnipeg
    tmpfs: ['/tmp:size=256M,mode=1777']
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/', timeout=2)",
        ]
      interval: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  # One-off steps, run before starting a new version: migrations and the official trails.
  release:
    <<: *app
    profiles: [tools]
    command: ['sh', '-c', 'node scripts/migrate-postgres.mjs && node scripts/seed-node.mjs']
    restart: 'no'

  # Daily database dump to the backup bucket (started by the host's systemd timer).
  backup:
    <<: *app
    profiles: [tools]
    command: ['node', 'scripts/backup-database.mjs']
    restart: 'no'

  web:
    <<: *app
    command: ['node', 'server.js']
    networks:
      default:
      # Caddy reaches each stage's website by this name (deploy/Caddyfile).
      edge: { aliases: ['${WINNIGO_STAGE:-production}-web'] }
    restart: unless-stopped

  worker:
    <<: *app
    command: ['node', 'scripts/worker.mjs']
    environment:
      <<: *app-environment
      WINNIGO_FLARESOLVERR_URL: http://flaresolverr:8191
    depends_on:
      postgres:
        condition: service_healthy
      flaresolverr:
        condition: service_healthy
    volumes: ['worker-data:/data']
    healthcheck:
      test: ['CMD', 'node', 'scripts/check-worker.mjs']
      interval: 30s
      retries: 3
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    # Only production runs Caddy; staging sets this to 0 (deploy/compose.sh).
    scale: ${WINNIGO_CADDY_SCALE:-1}
    ports: ['80:80', '443:443', '443:443/udp']
    networks: [edge]
    environment:
      WINNIGO_DOMAIN: ${WINNIGO_DOMAIN:?Set WINNIGO_DOMAIN in .env.production}
      # Optional: the staging host (docs/32). Unset, it is plain-HTTP staging.localhost, for
      # which Caddy requests no certificate.
      WINNIGO_STAGING_DOMAIN: ${WINNIGO_STAGING_DOMAIN:-http://staging.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
    restart: unless-stopped
    logging: *logging

# Shared by production's Caddy and each stage's website; deploy/compose.sh creates it.
networks:
  edge:
    name: winnigo-edge
    external: true

volumes:
  postgres:
  worker-data:
  caddy-data:
  caddy-config:
